<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
        <link rel="stylesheet" href="css/styles.css">

        <link rel="icon" href="/images/music.png" type="image/x-icon">
    </head>
    <body onload="myfunc()">
        <div class="main-container">
            <div class="container">

                <h2 class="dashboard-title">Admin Panel</h2>



                <nav>
                    <ul>
                        <li id="show-users">Users</li>
                        <li id="show-songs">Songs</li>
                        <li id="show-artists">Artists</li>
                    </ul>
                </nav>



                <div id="content" class="content">
                    <!-- Content will be loaded here via JavaScript -->
                    
                    <div id="user-tab" class="tabs">

                        <div class="func-bar">
                            <button id="openCreateUserPopup" class="list-btns">+ Create User</button>

                            <span>
                                <span class="search-icon">🔍</span>
                                <input type="text" class="search-items" id="searchUsers" placeholder="Search Users" onkeyup="filterUsers()">
                            </span>
                        </div><br>

                        <div id="user-list" class="lists user-list">
                            <!-- Usernames will be displayed here -->
                        </div>

                        <p class="not-found-text" id="noUsersMessage">No users found</p>
                    </div>



                    <div id="artist-tab" class="tabs">
                        <div class="func-bar">
                            <button id="openCreateArtistPopup" class="list-btns">+ Create Artist</button>

                            <span>
                                <span class="search-icon">🔍</span>
                                <input type="text" class="search-items" id="searchArtists" placeholder="Search Artists" onkeyup="filterArtists()">
                            </span>
                        </div><br>

                        <div id="artist-list" class="lists">
                            <!-- Artist names will be displayed here -->
                        </div>

                        <p class="not-found-text" id="noArtistsMessage">No Artists found</p>
                    </div>



                    <div id="song-tab" class="tabs">
                        <div class="func-bar">
                            <button id="openCreateSongPopup" class="list-btns">+ Add a Song</button>

                            <span>
                                <span class="search-icon">🔍</span>
                                <input type="text" class="search-items" id="searchSongs" placeholder="Search Songs" onkeyup="filterSongs()">
                            </span>
                        </div><br>

                        <div id="song-list" class="lists">
                            <!-- Song names will be displayed here -->
                        </div>

                        <p class="not-found-text" id="noSongsMessage">No Songs found</p>
                    </div>

                </div>



                <button id="logout" class="danger">Log out</button>

            </div>
        </div>

        <div id="popup-container"></div>

        <script src="js/dashboard.js"></script>

        <script src="js/createUserPopup.js"></script>
        <script src="js/createArtistPopup.js"></script>
        <script src="/js/createSongPopup.js"></script>
        
        <script src="js/updateUserPopup.js"></script>
        <script src="js/updateArtistPopup.js"></script>
        <script src="js/updateSongPopup.js"></script>
    </body>
</html>
